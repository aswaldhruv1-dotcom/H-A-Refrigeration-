<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>H-A Refrigeration</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f9ff;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #0077ff, #00b4d8);
      color: white;
      padding: 25px 18px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }

    .logo {
      width: 75px;
      height: 75px;
      background: white;
      color: #0077ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    header h1 {
      margin-top: 12px;
      font-size: 28px;
    }

    header p {
      margin-top: 7px;
      opacity: 0.95;
    }

    .hero {
      padding: 25px 18px;
      text-align: center;
    }

    .hero h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #596579;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 30px;
      font-weight: bold;
      display: inline-block;
    }

    .call {
      background: #0077ff;
      color: white;
    }

    .whatsapp {
      background: #25d366;
      color: white;
    }

    section {
      padding: 20px 18px;
    }

    .title {
      text-align: center;
      font-size: 23px;
      margin-bottom: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: white;
      padding: 20px 12px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 17px;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 13px;
      color: #697386;
      line-height: 1.4;
    }

    .about {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
      line-height: 1.6;
      color: #596579;
    }

    .contact-box {
      background: linear-gradient(135deg, #0077ff, #00b4d8);
      color: white;
      padding: 25px 18px;
      border-radius: 22px;
      text-align: center;
    }

    .contact-box h2 {
      margin-bottom: 10px;
    }

    .contact-box p {
      margin-bottom: 18px;
    }

    .location {
      margin-top: 15px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #697386;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .cards {
        grid-template-columns: repeat(4, 1fr);
      }

      .hero {
        padding: 50px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">H-A</div>
    <h1>H-A Refrigeration</h1>
    <p>AC & Refrigerator Repair
